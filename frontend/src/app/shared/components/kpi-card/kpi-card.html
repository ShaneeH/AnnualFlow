<div class="kpi-card">
  <span class="kpi-title">
    {{ title() }}
  </span>

  <h2 class="kpi-value">
    @if (value() !== null) {
      {{ displayValue() }}
    } @else {
      <span class="kpi-empty"> {{ empty }} </span>
    }
  </h2>

  @if (change() !== null) {
    <span class="kpi-change" [class.positive]="change()! >= 0" [class.negative]="change()! < 0">
      {{ change()! >= 0 ? '▲' : '▼' }}

      {{ displayChange() }}
    </span>
  }
</div>
